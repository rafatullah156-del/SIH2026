services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: lm
      POSTGRES_USER: lm
      POSTGRES_PASSWORD: lm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/lmdata;
      exit 0;
      "

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis
      - minio
      - minio-init
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis
      - minio
      - minio-init
    command: >
      celery -A app.workers.celery_app.celery_app worker
      --loglevel=info
      --queues=default

volumes:
  pgdata:
  miniodata: